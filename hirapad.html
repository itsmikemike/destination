<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hirapad">
<meta name="theme-color" content="#FEFEFE">
<title>Hirapad</title>
<link id="fav" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fff'/%3E%3Cpath d='M50 10V90M10 50H90' stroke='rgba(188,0,45,.35)' stroke-width='1.4' stroke-dasharray='5 4'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23BC002D'/%3E%3C/svg%3E">
<link id="touchicon" rel="apple-touch-icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Arcade (Yahoo UDS) tokens, applied */
:root{
  --carbon-0:#fefefe; --carbon-1:#f3f2ef; --carbon-2:#e8e7e4; --carbon-3:#dcdbd8; --carbon-4:#bfbebb; --carbon-5:#97928b; --carbon-6:#676665; --carbon-11:#1a1919;
  --purple-0:#f3f0fe; --purple-1:#e4dcfd; --purple-3:#c6b8fb; --purple-4:#9747ff; --purple-5:#7d2eff; --purple-6:#6b27d9; --purple-7:#5a20b5;
  --yellow-0:#fffae5; --yellow-1:#fff4c2; --yellow-2:#ffe876; --yellow-3:#ffd93e; --yellow-4:#f6bd0f; --yellow-8:#835d00;
  --green-0:#e6f7ec; --green-1:#c7edd3; --green-5:#0f914a; --green-6:#017647; --green-7:#016138;
  --red-0:#ffefeb; --red-1:#ffded4; --red-5:#e14430; --red-6:#c62626; --red-7:#ab1c1b;
  --hinomaru:#BC002D;

  --bg-primary:var(--carbon-0); --bg-secondary:var(--carbon-1); --bg-card:#ffffff;
  --fg-primary:var(--carbon-11); --fg-secondary:var(--carbon-6); --fg-tertiary:var(--carbon-5);
  --line-primary:rgba(26,25,25,.12); --line-secondary:rgba(26,25,25,.06); --line-strong:rgba(26,25,25,.24);
  --accent:var(--purple-5); --accent-press:var(--purple-6); --accent-soft:var(--purple-0); --accent-line:var(--purple-3);
  --positive:var(--green-6); --positive-soft:var(--green-0); --positive-line:var(--green-1);
  --alert:var(--red-6); --alert-soft:var(--red-0); --alert-line:var(--red-1);
  --tile:var(--yellow-1); --tile-edge:var(--yellow-2); --tile-ink:var(--yellow-8); --meter:var(--yellow-4);
  --pad:#ffffff; --pad-cross:rgba(188,0,45,.28); --ghost:rgba(131,93,0,.15); --answer:rgba(1,118,71,.30);
  --ink:#1a1919;
  --shadow-xs:0 1px 2px rgba(31,31,31,.06);
  --shadow-md:0 2px 4px rgba(31,31,31,.06),0 4px 12px rgba(31,31,31,.06);
  --shadow-lg:0 4px 8px rgba(31,31,31,.08),0 12px 24px rgba(31,31,31,.08);
  --shadow-card:0 1px 2px rgba(31,31,31,.06),0 4px 12px rgba(31,31,31,.04);
  --inset-sm:inset 0 1px 2px rgba(31,31,31,.10); --inset-md:inset 0 2px 4px rgba(31,31,31,.14);
  --r-sm:4px; --r-md:8px; --r-lg:16px; --r-xl:32px; --r-full:9999px;
  --font-ui:"YA Sans VF","Helvetica Neue",-apple-system,BlinkMacSystemFont,system-ui,Arial,sans-serif;
  --font-display:"Centra No2","Centra","Helvetica Neue",-apple-system,system-ui,Arial,sans-serif;
  --font-kana:"Kiwi Maru","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-primary:#1a1919; --bg-secondary:#232121; --bg-card:#2b2a2a;
    --fg-primary:#fefefe; --fg-secondary:#bfbebb; --fg-tertiary:#97928b;
    --line-primary:rgba(255,255,255,.12); --line-secondary:rgba(255,255,255,.06); --line-strong:rgba(255,255,255,.24);
    --accent:#9747ff; --accent-press:#7d2eff; --accent-soft:#260c4b; --accent-line:#5a20b5;
    --positive:#58c383; --positive-soft:#002715; --positive-line:#014f2d;
    --alert:#f86a4f; --alert-soft:#360a0a; --alert-line:#731113;
    --tile:#312200; --tile-edge:#6a4a00; --tile-ink:#ffd93e; --meter:#f6bd0f;
    --pad:#232121; --pad-cross:rgba(248,106,79,.35); --ghost:rgba(255,217,62,.16); --answer:rgba(88,195,131,.32);
    --ink:#fefefe;
  }
}
:root[data-theme="dark"]{
    --bg-primary:#1a1919; --bg-secondary:#232121; --bg-card:#2b2a2a;
    --fg-primary:#fefefe; --fg-secondary:#bfbebb; --fg-tertiary:#97928b;
    --line-primary:rgba(255,255,255,.12); --line-secondary:rgba(255,255,255,.06); --line-strong:rgba(255,255,255,.24);
    --accent:#9747ff; --accent-press:#7d2eff; --accent-soft:#260c4b; --accent-line:#5a20b5;
    --positive:#58c383; --positive-soft:#002715; --positive-line:#014f2d;
    --alert:#f86a4f; --alert-soft:#360a0a; --alert-line:#731113;
    --tile:#312200; --tile-edge:#6a4a00; --tile-ink:#ffd93e; --meter:#f6bd0f;
    --pad:#232121; --pad-cross:rgba(248,106,79,.35); --ghost:rgba(255,217,62,.16); --answer:rgba(88,195,131,.32);
    --ink:#fefefe;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-ui);font-size:17px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* header */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 24px;max-width:1100px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.3px}
.brand canvas{width:32px;height:32px;border-radius:9px;box-shadow:0 0 0 1px var(--line-primary)}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--line-primary);
  background:var(--bg-card);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.pill svg{width:20px;height:20px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r-full);border:1px solid var(--line-primary);background:var(--bg-card);color:var(--fg-secondary);transition:background .15s,transform .12s}
.iconbtn:active{transform:scale(.94);box-shadow:var(--inset-sm)}
.iconbtn svg{width:22px;height:22px}

.scripts{display:flex;gap:8px;padding:2px 24px 12px;max-width:1100px;width:100%;margin:0 auto;overflow-x:auto}
.script{display:flex;align-items:baseline;gap:8px;height:40px;align-items:center;padding:0 16px;border-radius:var(--r-full);border:1px solid var(--line-primary);
  background:var(--bg-card);font-weight:600;font-size:15px;color:var(--fg-secondary);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.script .jp{font-family:var(--font-kana);font-weight:500;font-size:16px}
.script[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.script .soon{font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-full);background:var(--bg-secondary);color:var(--fg-tertiary)}

.tabs{position:relative;display:flex;gap:4px;padding:0 24px;max-width:1100px;width:100%;margin:0 auto;border-bottom:1px solid var(--line-primary)}
.tab{background:none;border:none;padding:12px 16px 14px;font-weight:600;font-size:16px;color:var(--fg-secondary);transition:color .15s}
.tab[aria-selected="true"]{color:var(--fg-primary)}
.tabbar{position:absolute;left:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transition:transform .25s var(--ease-out),width .25s var(--ease-out)}
.view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.viewin{max-width:1100px;margin:0 auto;padding:8px 24px 48px}

/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:30px;padding:64px 0 60px}
.node{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.nodebtn{width:88px;height:88px;border-radius:50%;border:none;display:grid;place-items:center;font-family:var(--font-kana);font-weight:500;font-size:40px;
  transition:transform .15s var(--ease-out),box-shadow .15s}
.nodebtn:active{transform:scale(.93)}
.node.done .nodebtn{background:var(--accent);color:#fff;box-shadow:var(--shadow-md)}
.node.current .nodebtn{background:var(--bg-card);color:var(--accent);box-shadow:0 0 0 3px var(--accent),var(--shadow-lg)}
.node.current .nodebtn::after{content:"";position:absolute;width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 3px var(--accent);animation:halo 2s var(--ease-out) infinite;pointer-events:none}
.node.locked .nodebtn{background:var(--bg-secondary);color:var(--fg-tertiary);box-shadow:inset 0 0 0 1px var(--line-primary)}
.node .lbl{font-weight:600;font-size:14px;color:var(--fg-secondary)}
.node.current .lbl{color:var(--accent)}
.node svg{width:36px;height:36px}
.bubble{position:absolute;top:-46px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:7px 14px;border-radius:var(--r-full);white-space:nowrap;
  animation:bob 2.4s ease-in-out infinite;box-shadow:var(--shadow-md)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--accent);transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* chart */
.chartwrap{max-width:640px;margin:0 auto;padding-top:20px}
.chart{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cell{aspect-ratio:1.15/1;border-radius:var(--r-lg);border:1px solid var(--tile-edge);background:var(--tile);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 6px 10px;color:var(--tile-ink);transition:transform .12s var(--ease-out)}
.cell:active{transform:scale(.95);box-shadow:var(--inset-md)}
.cell.blank{background:transparent;border:1px dashed var(--line-primary)}
.cell.unseen{background:var(--bg-secondary);border-color:var(--line-primary);color:var(--fg-tertiary)}
.cell .k{font-family:var(--font-kana);font-weight:500;font-size:clamp(26px,5vw,38px);line-height:1.1}
.cell .r{font-weight:600;font-size:14px;letter-spacing:.2px}
.meter{width:60%;height:6px;border-radius:var(--r-full);background:rgba(131,93,0,.15);margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--meter);border-radius:var(--r-full);transform-origin:left;animation:grow .6s var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}}
.note{color:var(--fg-secondary);font-size:15px;line-height:1.6;margin:0 0 18px;text-align:center}

/* practice */
.practice{max-width:560px;margin:40px auto;text-align:center}
.practice h2{font-family:var(--font-display);font-size:28px;letter-spacing:-.4px;margin:0 0 8px}
.practice p{color:var(--fg-secondary);line-height:1.6;margin:0 0 22px}
.weak{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:28px}
.weak span{font-family:var(--font-kana);font-weight:500;font-size:30px;width:60px;height:60px;display:grid;place-items:center;border-radius:var(--r-lg);background:var(--tile);color:var(--tile-ink);border:1px solid var(--tile-edge)}

/* buttons */
.btn{border:1px solid transparent;border-radius:var(--r-full);height:56px;padding:0 30px;font-weight:700;font-size:17px;min-width:150px;
  transition:transform .12s var(--ease-out),background .15s,box-shadow .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:scale(.97);box-shadow:var(--inset-md)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active:not(:disabled){background:var(--accent-press)}
.btn.primary:disabled{background:var(--bg-secondary);color:var(--fg-tertiary);opacity:1;cursor:default;border-color:var(--line-primary)}
.btn.ok{background:var(--positive);color:#fff}
.btn.bad{background:var(--alert);color:#fff}
.btn.secondary{background:var(--bg-card);border-color:var(--line-strong);color:var(--fg-primary)}
.btn.text{background:none;min-width:0;padding:0 14px;color:var(--fg-secondary)}
.btn.small{height:44px;min-width:0;padding:0 18px;font-size:15px}

/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg-primary);display:flex;flex-direction:column;z-index:20;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lhead{display:flex;align-items:center;gap:16px;padding:16px 24px;max-width:1000px;width:100%;margin:0 auto}
.pbar{flex:1;height:14px;border-radius:var(--r-full);background:var(--bg-secondary);overflow:hidden;box-shadow:var(--inset-sm)}
.pbar i{position:relative;display:block;height:100%;width:0;background:var(--accent);border-radius:var(--r-full);transition:width .45s var(--ease-out);overflow:hidden}
.pbar i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.pbar i.sheen::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sheen .7s ease-out}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.hearts{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;color:var(--alert);position:relative;font-variant-numeric:tabular-nums}
.hearts svg{width:26px;height:26px}
.stage{flex:1;overflow:auto;padding:8px 24px 24px;max-width:1000px;width:100%;margin:0 auto;display:flex;flex-direction:column}
.exwrap{flex:1;display:flex;flex-direction:column}
.prompt{font-family:var(--font-display);font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.4px;margin:6px 0 22px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.kcard{background:var(--tile);border:1px solid var(--tile-edge);border-radius:var(--r-xl);box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 36px 18px;color:var(--tile-ink)}
.kcard .big{font-family:var(--font-kana);font-weight:500;font-size:clamp(110px,15vw,160px);line-height:1}
.kcard .rom{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:.3px}
.kcard.compact{flex-direction:row;padding:12px 28px;border-radius:var(--r-lg)}
.kcard.compact .rom{margin:0;font-size:36px}
.speak{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--bg-card);
  font-weight:600;font-size:15px;color:var(--accent);transition:transform .12s}
.speak:active{transform:scale(.95);box-shadow:var(--inset-sm)}
.speak svg{width:22px;height:22px}
.speak.icon{width:56px;height:56px;padding:0;justify-content:center}
.speak.icon svg{width:26px;height:26px}
.speak.big{height:84px;padding:0 30px;font-size:17px}
.speak.big svg{width:36px;height:36px}
.speak.playing svg{animation:pulse .5s ease-in-out 2}
.say{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 14px;border-radius:var(--r-lg);background:var(--bg-secondary);border:1px solid var(--line-primary);
  color:var(--fg-secondary);font-size:15px;line-height:1.35;text-align:left;max-width:360px;transition:border-color .2s,background .2s}
.say b{display:block;color:var(--fg-primary);font-size:19px;font-weight:700;letter-spacing:.2px}
.say small{display:block;font-size:14px;color:var(--fg-secondary)}
.say.playing{border-color:var(--accent-line);background:var(--accent-soft)}
.say.hidden-text b,.say.hidden-text small{filter:blur(7px);opacity:.5}
.bars{display:inline-flex;align-items:center;gap:3px;height:24px;flex:none}
.bars i{width:4px;height:6px;border-radius:2px;background:var(--accent);opacity:.5;transition:height .2s,opacity .2s}
.say.playing .bars i{opacity:1;animation:eq .8s ease-in-out infinite}
.say.playing .bars i:nth-child(2){animation-delay:.12s}.say.playing .bars i:nth-child(3){animation-delay:.24s}
.say.playing .bars i:nth-child(4){animation-delay:.36s}.say.playing .bars i:nth-child(5){animation-delay:.18s}
@keyframes eq{0%,100%{height:6px}50%{height:24px}}
.seg{display:flex;gap:6px;background:var(--bg-secondary);padding:4px;border-radius:var(--r-full);border:1px solid var(--line-primary)}
.seg button{flex:1;border:none;background:none;height:40px;border-radius:var(--r-full);font-weight:600;font-size:15px;color:var(--fg-secondary);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--bg-card);color:var(--fg-primary);box-shadow:var(--shadow-xs)}
.credit{font-size:13px;color:var(--fg-tertiary);line-height:1.5;margin:10px 0 0}
.credit a{color:var(--fg-secondary)}
@keyframes pulse{50%{transform:scale(1.2)}}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:620px}
.opt{position:relative;background:var(--bg-card);border:1px solid var(--line-primary);box-shadow:var(--shadow-card);border-radius:var(--r-lg);padding:16px 10px;
  font-weight:700;font-size:26px;min-height:86px;transition:transform .12s var(--ease-out),border-color .15s,background .15s,opacity .2s}
.opt.kana{font-family:var(--font-kana);font-weight:500;font-size:50px;padding:8px;color:var(--tile-ink)}
.opt:active:not(:disabled){transform:scale(.97);box-shadow:var(--inset-sm)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.opt.right{border-color:var(--positive);background:var(--positive-soft);box-shadow:0 0 0 2px var(--positive);color:var(--positive)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft);box-shadow:0 0 0 2px var(--alert);color:var(--alert)}
.opt.ruled{opacity:.4;box-shadow:none}
.opt.ruled::after{content:"";position:absolute;left:22%;right:22%;top:50%;height:2px;background:var(--alert);border-radius:2px;transform:rotate(-8deg)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 36px;width:100%;max-width:560px}
.match .col{display:flex;flex-direction:column;gap:12px}
.opt.gone{opacity:0;transform:scale(.85);pointer-events:none;transition:opacity .3s,transform .3s}

.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:center;flex:1}
.introL{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hook{max-width:340px;color:var(--fg-secondary);font-size:16px;line-height:1.6;margin:0}
.hook b{color:var(--fg-primary)}
.padcol{display:flex;flex-direction:column;align-items:center;gap:14px}
.padlabel{font-weight:600;color:var(--fg-secondary);font-size:15px}

/* writing pad: practice square with the hinomaru-red dashed cross */
.pad{position:relative;width:min(470px,78vw,46vh);aspect-ratio:1;border-radius:var(--r-xl);background:var(--pad);
  border:1px solid var(--line-primary);box-shadow:var(--shadow-lg);touch-action:none;overflow:hidden;transition:box-shadow .25s}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none}
.pad::before{left:calc(50% - 1px);top:16px;bottom:16px;width:2px;background-image:linear-gradient(var(--pad-cross) 55%,transparent 0);background-size:2px 16px}
.pad::after{top:calc(50% - 1px);left:16px;right:16px;height:2px;background-image:linear-gradient(90deg,var(--pad-cross) 55%,transparent 0);background-size:16px 2px}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
.pad.ok{box-shadow:0 0 0 3px var(--positive),var(--shadow-lg)}
.pad.bad{box-shadow:0 0 0 3px var(--alert),var(--shadow-lg)}
.pad.locked canvas{pointer-events:none}
.padtools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.padmsg{min-height:24px;font-weight:700;font-size:16px;text-align:center}
.padmsg.ok{color:var(--positive)} .padmsg.bad{color:var(--alert)}

/* footer */

.factions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* end screen */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;position:relative}

.seal.fail{background:var(--bg-secondary);color:var(--fg-tertiary);box-shadow:inset 0 0 0 2px var(--line-strong)}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.statcard{border:1px solid var(--line-primary);border-radius:var(--r-lg);min-width:130px;background:var(--bg-card);box-shadow:var(--shadow-card);padding:14px 18px}
.statcard b{display:block;font-size:13px;font-weight:600;color:var(--fg-secondary);letter-spacing:.2px}
.statcard span{display:block;font-family:var(--font-display);font-size:30px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:visible}
.confetti i{position:absolute;left:50%;top:38%;width:10px;height:14px;border-radius:2px}

/* sheet + dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim.mid{align-items:center;padding:20px}
.sheet{background:var(--bg-card);width:100%;max-width:640px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:12px 24px calc(28px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}

.sheet h4{font-size:15px;font-weight:600;color:var(--fg-secondary);margin:22px 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-secondary)}

.switch{width:52px;height:32px;border-radius:var(--r-full);border:none;background:var(--carbon-4);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs);transition:transform .2s var(--ease-out)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.iconopt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:6px;border-radius:var(--r-lg);font-size:13px;font-weight:600;color:var(--fg-secondary)}
.iconopt canvas{width:100%;max-width:84px;aspect-ratio:1;border-radius:22%;box-shadow:0 0 0 1px var(--line-primary),var(--shadow-xs);transition:transform .15s var(--ease-out),box-shadow .15s}
.iconopt[aria-pressed="true"]{color:var(--accent)}
.iconopt[aria-pressed="true"] canvas{box-shadow:0 0 0 3px var(--accent),var(--shadow-md);transform:scale(1.04)}
.dialog{background:var(--bg-card);border-radius:var(--r-xl);padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.dialog h3{margin:0 0 8px;font-family:var(--font-display);font-size:22px}
.dialog p{color:var(--fg-secondary);line-height:1.6;margin:0 0 20px}
.dialog .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg-primary);color:var(--bg-primary);
  padding:12px 22px;border-radius:var(--r-full);font-weight:600;font-size:15px;z-index:60;box-shadow:var(--shadow-lg)}

@media (max-width:820px){
  .intro{grid-template-columns:1fr;gap:20px}
  .kcard .big{font-size:110px}
  .footin{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(() => {
"use strict";
/* ============================================================
   SCRIPTS — each writing system is a self-contained course.

   ============================================================ */
const HIRAGANA = {
  id:'hiragana', name:'Hiragana', native:'ひらがな', available:true,
  rows:[
    {id:'a', label:'Vowels',  chars:'あいうえお'},
    {id:'k', label:'K Row',   chars:'かきくけこ'},
    {id:'s', label:'S Row',   chars:'さしすせそ'},
    {id:'t', label:'T Row',   chars:'たちつてと'},
    {id:'n', label:'N Row',   chars:'なにぬねの'},
    {id:'h', label:'H Row',   chars:'はひふへほ'},
    {id:'m', label:'M Row',   chars:'まみむめも'},
    {id:'y', label:'Y Row',   chars:'やゆよ'},
    {id:'r', label:'R Row',   chars:'らりるれろ'},
    {id:'w', label:'W Row + N', chars:'わをん'}
  ],
  reading:{あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',
    た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',
    ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n'},
  display:{を:'o (wo)'},
  speakAs:{を:'お'},
  clip:{を:'wo'}, clipGroup:'seion',
  sayAs:{を:['oh','the same sound as お, used as a particle']},
  hooks:{
    あ:'A stick figure cradling a big round <b>a</b>pple, "ah!"', い:'Two <b>ee</b>ls swimming side by side.',
    う:'A person with a little hat looking <b>oo</b>p at the sky.', え:'A ninja mid-leap shouting "<b>eh</b>!"',
    お:'A golfer and a flying ball, "<b>oh</b>!" The ball sits on the right, unlike あ.',
    か:'A <b>ka</b>rate chop with a spark beside it.', き:'A <b>key</b> with two teeth.', く:'An open beak, "<b>cu</b>ckoo".',
    け:'A <b>ke</b>g with a tap on the side.', こ:'Two <b>co</b>i fish, one above the other.',
    さ:'A signpost leaning, "<b>sa</b>y which way?" It mirrors ち.', し:'A fishhook. <b>She</b> goes fishing.',
    す:'A <b>swing</b> with a loop in the rope.', せ:'A mouth open saying "<b>se</b>!" with a tooth inside.', そ:'A zigzag of thread, <b>so</b>wing.',
    た:'A <b>t</b> and an <b>a</b> squeezed together.', ち:'A cheerleader, "<b>chee</b>r!" It mirrors さ.', つ:'A <b>tsu</b>nami wave rolling in.',
    て:'A hand reaching for a <b>te</b>lescope.', と:'A <b>toe</b> with a splinter in it.',
    な:'A <b>nu</b>n praying beside a cross.', に:'A <b>knee</b> next to a stick.', ぬ:'<b>Noo</b>dles on chopsticks. The loop is the twirl; め has none.',
    ね:'A cat curling its tail. <b>Ne</b>ko means cat.', の:'A "<b>no</b> entry" sign in one swoop.',
    は:'"<b>Ha</b>!" Like け with a loop at the bottom.', ひ:'A big grin, "<b>hee</b> hee".', ふ:'Mount <b>Fu</b>ji with its peaks.',
    へ:'A single mountain peak. <b>He</b>ad to the top.', ほ:'A <b>ho</b>e: は with one more bar on top.',
    ま:'<b>Ma</b>ma\'s cross with a loop below.', み:'A <b>me</b>ditating 21, swirl then tail.', む:'A cow saying "<b>moo</b>" with a flicked tail.',
    め:'An eye. <b>Me</b> means eye. It\'s ぬ without the loop.', も:'A fishhook with <b>mo</b>re bait: two bars.',
    や:'A <b>ya</b>k\'s horns.', ゆ:'A fish making a <b>U</b>-turn.', よ:'A <b>yo</b>-yo hanging on a string.',
    ら:'A <b>ra</b>bbit with its ears up.', り:'<b>Ree</b>ds by a river, taller than い.', る:'A <b>roo</b>te that ends in a loop. ろ has no loop.',
    れ:'A man kneeling to <b>re</b>st, with a kick-up tail.', ろ:'A <b>ro</b>ad: る without the loop.',
    わ:'A <b>wa</b>sp curling up. Like れ, but rounded at the end.', を:'Only used as the particle that marks an object. Sounds like <b>o</b>.',
    ん:'Looks like a handwritten <b>n</b>.'
  },
  confuse:[['は','ほ','け'],['ぬ','め','の'],['ね','れ','わ'],['る','ろ','そ'],['さ','ち','き'],['い','り','こ'],['こ','に','た'],['あ','お','め'],
    ['し','つ','く','へ'],['う','ら','つ'],['ま','も','ほ'],['す','む','お'],['ゆ','よ','ほ'],['ん','そ','と']],
  chart:['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や ゆ よ','らりるれろ','わ   を','ん    '],
  nodes:[
    {id:'a',row:'a'},{id:'k',row:'k'},{id:'rv1',review:['a','k'],label:'Review'},
    {id:'s',row:'s'},{id:'t',row:'t'},{id:'rv2',review:['a','k','s','t'],label:'Review'},
    {id:'n',row:'n'},{id:'h',row:'h'},{id:'rv3',review:['a','k','s','t','n','h'],label:'Review'},
    {id:'m',row:'m'},{id:'y',row:'y'},{id:'rv4',review:['n','h','m','y'],label:'Review'},
    {id:'r',row:'r'},{id:'w',row:'w'},{id:'final',review:['a','k','s','t','n','h','m','y','r','w'],label:'Final Review'}
  ]
};
const SCRIPTS = {
  hiragana: HIRAGANA,
  katakana: {id:'katakana', name:'Katakana', native:'カタカナ', available:false},
  kanji:    {id:'kanji',    name:'Kanji',    native:'漢字',    available:false}
};
let S = HIRAGANA;
const ALL = () => S.rows.flatMap(r=>[...r.chars]);
const rowById = id => S.rows.find(r=>r.id===id);
const rd = c => (S.display && S.display[c]) || S.reading[c];

/* ============================================================
   PROGRESS — saved in this browser, one bucket per script.
   ============================================================ */
const KEY = 'hirapad';
const course = () => ({completed:{}, mastery:{}, seen:{}});
const blank = () => ({v:2, xp:0, streak:0, lastDay:'', sound:true, unlockAll:false, icon:'pad', voice:'recorded', captions:true, script:'hiragana', courses:{hiragana:course()}, updatedAt:0});
let P = blank();
try{
  const raw = localStorage.getItem(KEY);
  if (raw) P = Object.assign(blank(), JSON.parse(raw));
  else {
    const old = localStorage.getItem('hiragana-pad-v1');
    if (old){ const o = JSON.parse(old);
      P = Object.assign(blank(), {xp:o.xp||0, streak:o.streak||0, lastDay:o.lastDay||'', sound:o.sound!==false, unlockAll:!!o.unlockAll,
        courses:{hiragana:{completed:o.completed||{}, mastery:o.mastery||{}, seen:o.seen||{}}}}); }
  }
}catch(e){}
if (!P.iconPad){ P.icon='pad'; P.iconPad=true; }
const C = () => (P.courses[S.id] ||= course());
function save(){ P.updatedAt = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
const mastery = c => C().mastery[c] || 0;
const seenList = () => ALL().filter(c=>C().seen[c]);
function bump(c, d){ C().mastery[c] = Math.max(0, Math.min(5, mastery(c) + d)); }
const dayStr = (d=new Date()) => d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function markStreak(){ const t = dayStr(); if (P.lastDay===t) return; const y = new Date(); y.setDate(y.getDate()-1);
  P.streak = P.lastDay===dayStr(y) ? P.streak+1 : 1; P.lastDay = t; }

/* ============================================================
   MOTION helpers (Web Animations; skipped for reduced motion)
   ============================================================ */
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
function anim(el, frames, opts){ if (!el || reduce.matches || !el.animate) return Promise.resolve();
  const a = el.animate(frames, Object.assign({duration:250, easing:'cubic-bezier(.2,.8,.2,1)', fill:'both'}, opts));
  return a.finished.then(()=>{ try{ a.commitStyles(); }catch(e){} a.cancel(); }).catch(()=>{}); }
const pop = el => anim(el,[{transform:'scale(.6)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:420});
const shake = el => anim(el,[{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(9px)'},{transform:'translateX(-6px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:380,easing:'ease-out'});
const bounce = el => anim(el,[{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:320,easing:'cubic-bezier(.34,1.56,.64,1)'});
const fadeUp = (el, delay=0) => anim(el,[{transform:'translateY(14px)',opacity:0},{transform:'none',opacity:1}],{duration:320,delay});

/* ============================================================
   AUDIO — device Japanese voice
   ============================================================ */
/* Recorded native-speaker clips (online), with the device voice as backup.
   Clips: FUN Japanese Learning, CC BY 4.0, via the Kana Sounds dataset on Hugging Face. */
const CLIP_BASE = 'https://huggingface.co/datasets/arsalan-anwari/kana-sounds/resolve/main/audio/';
const clipUrl = c => { const f = (S.clip && S.clip[c]) || S.reading[c]; return f ? CLIP_BASE + (S.clipGroup||'seion') + '/' + f + '.mp3' : null; };
const player = new Audio(); player.preload = 'auto'; player.setAttribute('playsinline','');
let clipFails = 0, unlocked = false, playingC = null;
let jaVoice = null;
function pickVoice(){ if (!('speechSynthesis' in window)) return; const vs = speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  const score = v => (/premium|プレミアム/i.test(v.name)?4:0) + (/enhanced|拡張|高品質/i.test(v.name)?3:0) + (/Kyoko|O-ren|Hattori/i.test(v.name)?1:0) + (v.localService?0.5:0);
  jaVoice = vs.sort((a,b)=>score(b)-score(a))[0] || null; }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const useClips = () => P.voice !== 'device' && clipFails < 3;
const canListen = () => P.sound && (useClips() || !!jaVoice);
function setPlaying(c, on){
  document.querySelectorAll('.say').forEach(el=>{ if (el.dataset.c===c) el.classList.toggle('playing', on); else if (on) el.classList.remove('playing'); });
}
function deviceSpeak(c){
  if (!('speechSynthesis' in window)) return;
  try{ const u = new SpeechSynthesisUtterance((S.speakAs && S.speakAs[c]) || c); u.lang='ja-JP'; u.rate=.8; if (jaVoice) u.voice=jaVoice;
    u.onstart=()=>setPlaying(c,true); u.onend=u.onerror=()=>setPlaying(c,false);
    speechSynthesis.cancel(); speechSynthesis.speak(u); setPlaying(c,true); setTimeout(()=>setPlaying(c,false),1400); }catch(e){}
}
player.addEventListener('playing', ()=>playingC && setPlaying(playingC,true));
player.addEventListener('ended', ()=>playingC && setPlaying(playingC,false));
player.addEventListener('pause', ()=>playingC && setPlaying(playingC,false));
function speak(c, btn){
  if (btn){ btn.classList.remove('playing'); void btn.offsetWidth; btn.classList.add('playing'); }
  if (!P.sound) return;
  const url = useClips() && clipUrl(c);
  if (!url) return deviceSpeak(c);
  try{ if ('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  playingC = c; setPlaying(c,true);
  const fail = () => { clipFails++; if (clipFails===3) toast('Recorded audio is unavailable right now, so the device voice is filling in.'); deviceSpeak(c); };
  try{
    player.onerror = fail;
    if (player.src !== url) player.src = url;
    player.currentTime = 0;
    const pr = player.play();
    if (pr && pr.then) pr.then(()=>{ clipFails = 0; }).catch(err=>{ if (err && err.name==='NotAllowedError') deviceSpeak(c); else fail(); });
  }catch(e){ fail(); }
}
function primeSpeech(chars=[]){
  try{ if ('speechSynthesis' in window){ const u = new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
  if (!unlocked && useClips()){ try{ const first = clipUrl(chars[0]||'あ'); player.muted = true; player.src = first;
    const pr = player.play(); const done=()=>{ player.pause(); player.currentTime=0; player.muted=false; unlocked=true; };
    if (pr && pr.then) pr.then(done).catch(()=>{ player.muted=false; }); else done(); }catch(e){ player.muted=false; } }
  if (useClips()) chars.forEach(c=>{ const u=clipUrl(c); if (u) fetch(u,{mode:'no-cors'}).catch(()=>{}); });
}
/* Plain-English sound guide shown with every sound */
const VOW = {a:'ah', i:'ee', u:'oo', e:'eh', o:'oh'};
const SAY = {
  a:['ah','like the a in father'], i:['ee','like the ee in see'], u:['oo','like food, with relaxed lips'], e:['eh','like the e in pet'], o:['oh','like go, but short and clean'],
  shi:['shee','like she'], chi:['chee','like cheese without the s'], tsu:['tsoo','like the ts at the end of cats'], fu:['foo','softer than f, lips barely touching'],
  su:['soo','the u is light, almost just s'], ha:['hah',''], hi:['hee','breathy, a little like he'],
  ra:['rah','a quick tap of the tongue, between l and d'], ri:['ree','a quick tongue tap, between l and d'], ru:['roo','a quick tongue tap, between l and d'],
  re:['reh','a quick tongue tap, between l and d'], ro:['roh','a quick tongue tap, between l and d'],
  n:['n','a hum, like the ng at the end of sing'], wa:['wah',''], ya:['yah',''], yu:['you',''], yo:['yoh','']
};
function sayLike(c){
  if (S.sayAs && S.sayAs[c]) return S.sayAs[c];
  const r = S.reading[c]; if (SAY[r]) return SAY[r];
  const v = r.slice(-1); return [r.slice(0,-1) + (VOW[v]||v), ''];
}
function sayLine(c, {hidden=false}={}){
  const [snd, tip] = sayLike(c);
  const el = h('div',{class:'say'+(hidden?' hidden-text':''),'data-c':c,'aria-label': hidden ? 'Sound playing' : `Sounds like ${snd}. ${tip}`},

function distractors(c, pool, n=3){
  const bad = x => x===c || S.reading[x]===S.reading[c]; const out=[];
  shuffle(S.confuse.filter(g=>g.includes(c)).flat().filter(x=>!bad(x))).forEach(x=>{ if (out.length<2 && !out.includes(x)) out.push(x); });
  [shuffle(pool), shuffle(ALL())].forEach(src=>src.forEach(x=>{ if (out.length<n && !bad(x) && !out.includes(x)) out.push(x); }));
  return out.slice(0,n);
}

function buildRow(row){
  const news=[...row.chars], ex=[];
  for (let i=0;i<news.length;i+=2){ const g=news.slice(i,i+2); g.forEach(c=>ex.push({t:'intro',c})); ex.push(...shuffle(g.flatMap(c=>[{t:'pickRomaji',c}, soundQ(c)]))); }
  const old = shuffle(seenList().filter(c=>!news.includes(c))).slice(0,2);
  const ms = shuffle([...news,...old]).slice(0,5);
  const tail = [...(ms.length>=3?[{t:'match',cs:ms}]:[]), ...shuffle(news).slice(0,2).map(c=>({t:'write',c})), ...old.map(c=>pick([{t:'pickRomaji',c},soundQ(c),{t:'write',c}]))];
  return {ex:[...ex,...shuffle(tail)], pool:news};
}

  const ex=[]; weighted(chars,8).forEach((c,i)=>ex.push(i%3===2?{t:'write',c}:(i%2?soundQ(c):{t:'pickRomaji',c})));
  weighted(chars,4).forEach(c=>ex.push(pick([{t:'pickRomaji',c},{t:'write',c},soundQ(c)])));
  const out = shuffle(ex).slice(0,count); const m=shuffle(chars).slice(0,5); if (m.length>=4) out.splice(Math.floor(out.length/2),0,{t:'match',cs:m});

function choiceGrid(opts, isKana, ready){
  let sel=null; const btns=opts.map(c=>{ const b=h('button',{class:'opt'+(isKana?' kana':''),'aria-pressed':'false'}, isKana?c:rd(c)); b._c=c;
    b.onclick=()=>{ if (b.disabled) return; sel=c; btns.forEach(x=>x.setAttribute('aria-pressed', x===b)); bounce(b); ready(true); }; return b; });
  const grid=h('div',{class:'options'},btns);
  requestAnimationFrame(()=>btns.forEach((b,i)=>anim(b,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:260,delay:80+i*45})));
  return { grid, get sel(){ return sel; },
    judge(target){ const ok=sel===target; btns.forEach(b=>b.disabled=true);
      const sb=btns.find(b=>b._c===sel); if (ok){ sb.classList.add('right'); bounce(sb); } else { sb.classList.add('wrong'); shake(sb); } return ok; },
    retry(){ btns.forEach(b=>{ b.setAttribute('aria-pressed','false');
        if (b.classList.contains('wrong')){ b.classList.remove('wrong'); b.classList.add('ruled'); }
        if (!b.classList.contains('ruled')) b.disabled=false; }); sel=null; ready(false); },
    reveal(target){ btns.forEach(b=>{ b.disabled=true; if (b._c===target){ b.classList.add('right'); bounce(b); } }); } };
}
const EX = {

      retry:()=>g.retry(), reveal:()=>{ g.reveal(e.c); showCap(); } };

  pickKana(e, ctx){ return kanaChoice(e, ctx, false); },
  listen(e, ctx){ return kanaChoice(e, ctx, true); },

    const sp=h('button',{class:'speak icon','aria-label':'Hear it',html:ICON.speaker}); sp.onclick=()=>speak(e.c,sp);
    const card=h('div',{class:'kcard compact'}, h('div',{class:'rom'},rd(e.c)));
    stage.append(h('div',{class:'prompt'},'Write It From Memory'),
      h('div',{class:'center'}, h('div',{style:'display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center'}, card, sp, sayLine(e.c)),
        h('div',{class:'padcol'}, pad.el, padTools(pad))));
    pop(card); ready(false);
    return {
      check(){ const pct=Math.round(grade(pad.strokes,e.c,'write')*100), ok=pct>=62; pad.lock(true); pad.mark(ok); if (!ok) pad.setOverlay(e.c);
        return {ok, override:!ok, note:`<span class="kk">${e.c}</span>, ${pct}% shape match`,
          hint:`Compare yours with the green <span class="kk">${e.c}</span>. When you try again it fades away, so take a good look.`, answer:`<span class="kk">${e.c}</span> = ${rd(e.c)}`}; },
      async retry(){ pad.lock(false); await pad.clear(); pad.setOverlay(e.c); pad.fadeOverlay(1600); },
      reveal(){ pad.lock(true); pad.setOverlay(e.c); }, accept(){ pad.mark(true); },

      bounce(b);
      if (a && z){ const p=a, q=z; a=z=null;
        if (p._c===q._c){ [p,q].forEach(x=>{ x.disabled=true; x.setAttribute('aria-pressed','false'); x.classList.add('right'); }); bump(p._c,1);
          setTimeout(()=>[p,q].forEach(x=>x.classList.add('gone')),380);
          if (--left===0) setTimeout(()=>{ save(); auto({ok:true, note: slips?`${slips} mismatch${slips>1?'es':''}, all sorted`:'Perfect matching'}); },520);
        } else { slips++; bump(p._c,-1); [p,q].forEach(x=>{ x.setAttribute('aria-pressed','false'); x.classList.add('wrong'); shake(x); });
          setTimeout(()=>[p,q].forEach(x=>x.classList.remove('wrong')),500); } } }
    stage.append(h('div',{class:'prompt'},'Tap the Matching Pairs'), h('div',{class:'center'}, h('div',{class:'match'}, h('div',{class:'col'},Lb), h('div',{class:'col'},Rb))));
    [...Lb,...Rb].forEach((b,i)=>anim(b,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:260,delay:60+(i%Lb.length)*50}));
    return {check:()=>null};
  }
};

    h('div',{class:'row'}, h('div',{}, h('span',{},'Unlock all lessons'), h('small',{},'Open every row on the path')), sw(P.unlockAll, v=>{ P.unlockAll=v; save(); if (!lessonOpen) render(); })),
    h('h4',{},'Home Screen icon'), icons,
    h('p',{class:'note',style:'text-align:left;margin:12px 0 0'},'Pick one, then in Safari tap Share → Add to Home Screen. Already added? Remove it and add it again to see the new icon.'),
    h('p',{class:'credit'},'Character recordings by ', h('a',{href:'https://funjapaneselearning.com',target:'_blank',rel:'noopener'},'FUN Japanese Learning'),
      ', CC BY 4.0, from the ', h('a',{href:'https://huggingface.co/datasets/arsalan-anwari/kana-sounds',target:'_blank',rel:'noopener'},'Kana Sounds'),' dataset.'),
    h('h4',{},'Progress'),
    h('button',{class:'btn secondary small',style:'color:var(--alert)',onclick:()=>confirmBox('Reset All Progress?','This clears XP, streak, completed lessons, and mastery bars for every script.','Reset',()=>{ const keep={sound:P.sound, icon:P.icon, iconPad:true, voice:P.voice, captions:P.captions}; P=Object.assign(blank(),keep); save(); close(); render(); })},'Reset progress'));
  const m=h('div',{class:'scrim',onclick:e=>{ if (e.target===m) close(); }}, sheet);
  function close(){ anim(sheet,[{transform:'none'},{transform:'translateY(100%)'}],{duration:220,easing:'ease-in'}); anim(m,[{opacity:1},{opacity:0}],{duration:220}).then(()=>m.remove()); }
  document.body.append(m); anim(m,[{opacity:0},{opacity:1}],{duration:200}); anim(sheet,[{transform:'translateY(100%)'},{transform:'none'}],{duration:300});
}
$('#settingsBtn').addEventListener('click', openSettings);

function render(animate){
  $('#streak').textContent=P.streak; $('#xp').textContent=P.xp;
  renderScripts();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.tab===tab)));
  moveTabBar();
  const v=$('#view'); v.replaceChildren(); v.scrollTop=0; const inner=h('div',{class:'viewin'}); v.append(inner);
  ({learn:renderLearn, chart:renderChart, practice:renderPractice})[tab](inner);
  anim(inner,[{opacity:0},{opacity:1}],{duration:180});
}
S = SCRIPTS[P.script] && SCRIPTS[P.script].available ? SCRIPTS[P.script] : HIRAGANA;
applyIcon(); fontsReady.then(applyIcon);
render(); requestAnimationFrame(moveTabBar);
})();
</script>
</body>
